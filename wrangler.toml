name = "orbita-inbox-pocketflare"
main = "dist/worker.mjs"
compatibility_date = "2025-05-30"
compatibility_flags = ["no_handle_cross_request_promise_resolution"]
workers_dev = true

routes = [
  { pattern = "ingest.usestrum.app", custom_domain = true }
]

[vars]
POCKETFLARE_APP_URL = "https://ingest.usestrum.app"
POCKETFLARE_STORAGE_BUCKET_NAME = "orbita-inbox-pocketflare-storage"
POCKETFLARE_BACKUPS_BUCKET_NAME = "orbita-inbox-pocketflare-backups"
INBOX_TOKEN = ""
INBOX_RETENTION_DAYS = "90"
# POCKETFLARE_DB_MODE = "d1" # default; set to "do_sqlite" for Durable Object SQLite mode

# File copies stream through the Worker with bounded memory.
# Server-side R2 S3 CopyObject is disabled after deployed Worker E2E rejected
# r2.cloudflarestorage.com fetch URLs before HTTP.

[[d1_databases]]
binding = "APP_DB"
database_name = "orbita-inbox-pocketflare-app"
database_id = "0a0d31c8-8f4d-40cd-b589-b40d5d3dc813"

[[d1_databases]]
binding = "LOGS_DB"
database_name = "orbita-inbox-pocketflare-logs"
database_id = "87189998-4c1a-42f0-acea-0e7b1de38c21"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "orbita-inbox-pocketflare-storage"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "orbita-inbox-pocketflare-backups"

[assets]
directory = "./dist/admin-ui"
binding = "ASSETS"

[triggers]
crons = ["* * * * *"]

# ── Optional: DO SQLite mode ────────────────────────────────────────────
# Uncomment to run PocketBase inside a Durable Object backed by SQLite
# storage. Required when POCKETFLARE_DB_MODE = "do_sqlite".
#
# [[durable_objects.bindings]]
# name = "APP_DO"
# class_name = "AppDO"
#
# ── Optional: realtime/SSE via Durable Objects ─────────────────────────
# Uncomment to enable cross-isolate SSE. Without this, GET /api/realtime
# falls through to Go where SSE is non-functional on Workers (the WASM
# bridge's Flush is a no-op). ~$4/mo for a single always-warm DO instance.
#
# [[durable_objects.bindings]]
# name = "REALTIME_DO"
# class_name = "RealtimeDO"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["AppDO"]
# new_classes = ["RealtimeDO"]
